<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77E"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#8B6F2C"/>
    </linearGradient>
    <!-- Navy gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#020A15"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square with navy gradient -->
  <rect x="10" y="10" width="180" height="180" rx="32" ry="32" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Inner border: thin gold accent -->
  <rect x="18" y="18" width="164" height="164" rx="26" ry="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- Open book icon (knowledge) — centered, gold -->
  <!-- Left page -->
  <path d="M 60 70 Q 80 62, 100 70 L 100 130 Q 80 122, 60 130 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Right page -->
  <path d="M 100 70 Q 120 62, 140 70 L 140 130 Q 120 122, 100 130 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <!-- Book spine (center line) -->
  <line x1="100" y1="70" x2="100" y2="130" stroke="#020A15" stroke-width="1.5"/>
  <!-- Page lines (text suggestion) -->
  <line x1="70" y1="82" x2="92" y2="78" stroke="#020A15" stroke-width="1" opacity="0.4"/>
  <line x1="70" y1="92" x2="92" y2="88" stroke="#020A15" stroke-width="1" opacity="0.4"/>
  <line x1="70" y1="102" x2="92" y2="98" stroke="#020A15" stroke-width="1" opacity="0.4"/>
  <line x1="108" y1="78" x2="130" y2="82" stroke="#020A15" stroke-width="1" opacity="0.4"/>
  <line x1="108" y1="88" x2="130" y2="92" stroke="#020A15" stroke-width="1" opacity="0.4"/>
  <line x1="108" y1="98" x2="130" y2="102" stroke="#020A15" stroke-width="1" opacity="0.4"/>

  <!-- Star above book (excellence) -->
  <path d="M 100 40 L 103 48 L 112 48 L 105 53 L 108 61 L 100 56 L 92 61 L 95 53 L 88 48 L 97 48 Z" fill="url(#goldGrad)"/>

  <!-- FIA text below book -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3">FIA</text>
</svg>
